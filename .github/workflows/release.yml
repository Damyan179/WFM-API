name: Build Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover tests

      - name: Build the app
        run: python -m PyInstaller --noconsole --onedir --name "WFM Tools" --collect-all curl_cffi --hidden-import keyring.backends.Windows app.py

      - name: Zip the app
        run: Compress-Archive -Path "dist/WFM Tools" -DestinationPath WFM-Tools-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WFM-Tools-windows
          path: WFM-Tools-windows.zip

      - name: Publish a release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WFM-Tools-windows.zip
